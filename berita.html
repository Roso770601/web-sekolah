<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Berita Terbaru SDN 1 SUKAMANAH | Info Sekolah & Kegiatan</title>

<meta name="description" content="Berita terbaru SDN 1 SUKAMANAH. Informasi kegiatan sekolah, pengumuman, prestasi siswa, dan update terbaru.">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  color: #fff;

  background-image: url('gambar-sekolah.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* OVERLAY biar kontras */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

/* HEADER */
header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;

  position: sticky;
  top: 0;
  z-index: 1000;

  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
}

header h1 {
  margin: 0;
  font-size: 24px;
  color: #ffeb3b;
}

/* NAVBAR */
nav {
  text-align: center;
  padding: 10px;
}

nav a {
  color: #ffeb3b;
  margin: 0 12px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

nav a:hover {
  color: white;
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 900px;
  margin: 30px auto;
}

/* CARD */
.card {
  background: #ffffff;
  color: #333;
  padding: 15px;
  margin-bottom: 25px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  border-radius: 8px;
}

.card h2 {
  margin: 10px 0;
  color: #222;
}

.card p {
  color: #555;
  line-height: 1.6;
}

/* TANGGAL */
.tanggal {
  color: #777;
  font-size: 14px;
  margin-bottom: 10px;
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 14px;
  background: #0066cc;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  transition: 0.3s;
}

.btn:hover {
  background: #004a99;
}

/* PESAN ERROR / KOSONG */
.status-berita {
  background: #ffffff;
  color: #333;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 15px;
  background: rgba(0,0,0,0.7);
  color: white;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <h1>Berita SDN 1 Sukamanah</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="ppdb.html">PPDB</a>
  <a href="login.html">Cek Nilai</a>
  <a href="berita.html">Berita</a>
</nav>

<div class="container">

  <!-- DAFTAR BERITA OTOMATIS -->
  <div id="daftar-berita">

    <div class="status-berita">
      Memuat berita...
    </div>

  </div>

</div>

<footer>
  <p>© 2026 SDN 1 Sukamanah</p>
</footer>


<script>

fetch('berita/data.json')

  .then(response => {

    if (!response.ok) {
      throw new Error(
        'Gagal mengambil data berita. Status: ' + response.status
      );
    }

    return response.json();

  })

  .then(data => {

    // Urutkan berita dari tanggal terbaru
    data.sort((a, b) => {
      return new Date(b.tanggal) - new Date(a.tanggal);
    });

    const daftarBerita =
      document.getElementById('daftar-berita');

    // Kosongkan tulisan "Memuat berita..."
    daftarBerita.innerHTML = '';

    // Jika belum ada berita
    if (!data.length) {

      daftarBerita.innerHTML = `
        <div class="status-berita">
          <h2>Belum Ada Berita</h2>
          <p>
            Belum ada berita yang dapat ditampilkan.
          </p>
        </div>
      `;

      return;
    }

    // Tampilkan SEMUA berita
    data.forEach(berita => {

      const card = document.createElement('div');

      card.className = 'card';

      card.innerHTML = `

        <h2>${berita.judul}</h2>

        <div class="tanggal">
          ${formatTanggal(berita.tanggal)}
        </div>

        <p>
          Informasi terbaru mengenai kegiatan
          dan aktivitas SDN 1 Sukamanah.
        </p>

        <a
          href="berita/${berita.link}"
          class="btn"
        >
          Baca Selengkapnya
        </a>

      `;

      daftarBerita.appendChild(card);

    });

  })

  .catch(error => {

    console.error('Gagal memuat berita:', error);

    document.getElementById('daftar-berita').innerHTML = `

      <div class="status-berita">

        <h2>Berita Belum Tersedia</h2>

        <p>
          Terjadi masalah saat memuat berita.
        </p>

      </div>

    `;

  });


// ================================
// FORMAT TANGGAL INDONESIA
// ================================
function formatTanggal(tanggal) {

  const date = new Date(tanggal);

  if (isNaN(date)) {
    return tanggal;
  }

  return date.toLocaleDateString(
    'id-ID',
    {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }
  );

}

</script>

</body>
</html>
