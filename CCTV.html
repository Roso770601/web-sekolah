<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV SDN 1 Sukamanah</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* LOGO TENGAH */
#logo {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#logo img {
  width: 120px;
  opacity: 0.9;
}

#logo h1 {
  color: white;
  margin-top: 10px;
  font-size: 28px;
}

/* JAM */
#clock {
  position: absolute;
  top: 15px;
  right: 20px;
  color: white;
  font-size: 20px;
  background: rgba(0,0,0,0.5);
  padding: 5px 10px;
  border-radius: 5px;
}
</style>

</head>
<body>

<!-- VIDEO -->
<iframe id="video"
src="https://www.youtube.com/embed/_A6384scyNk?autoplay=1&mute=1&controls=0&modestbranding=1"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

<!-- OVERLAY -->
<div id="overlay">

  <div id="clock"></div>

</div>

<script>
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('id-ID');
  document.getElementById('clock').innerText = time;
}
setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
