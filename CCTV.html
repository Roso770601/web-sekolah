<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV SDN 1 Sukamanah</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* JAM */
#clock {
  position: absolute;
  top: 15px;
  right: 20px;
  color: white;
  font-size: 20px;
  background: rgba(0,0,0,0.5);
  padding: 5px 10px;
  border-radius: 5px;
}

/* WAITING TEXT */
#waiting {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: red;
  font-size: 30px;
  font-weight: bold;
  background: rgba(0,0,0,0.7);
  padding: 15px 25px;
  border-radius: 10px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0% {opacity: 1;}
  50% {opacity: 0.3;}
  100% {opacity: 1;}
}
</style>

</head>
<body>

<!-- VIDEO -->
<iframe id="video"
src="https://www.youtube.com/embed/_A6384scyNk?autoplay=1&mute=1&controls=0&modestbranding=1"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

<!-- OVERLAY -->
<div id="overlay">
  <div id="clock"></div>
  <div id="waiting">🔴 LIVE STREAM CCTV SDN 1 SUKAMANAH .... SEDANG DIPERSIAPKAN</div>
</div>

<script>

// =======================
// MODE (TINGGAL GANTI INI)
// =======================
let mode = "waiting"; // 👉 ganti jadi "live" kalau sudah diizinkan


// LOGIC MODE
function updateMode() {
  const video = document.getElementById("video");
  const waiting = document.getElementById("waiting");

  if (mode === "waiting") {
    video.style.display = "none";
    waiting.style.display = "block";
  } else {
    video.style.display = "block";
    waiting.style.display = "none";
  }
}

updateMode();


// JAM
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('id-ID');
  document.getElementById('clock').innerText = time;
}
setInterval(updateClock, 1000);
updateClock();

</script>

</body>
</html>
