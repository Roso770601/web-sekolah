name: Build public website preview (no deployment)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # checkout v6, verified via official API
        with:
          persist-credentials: false
      - name: Build allowlisted public files and validate links
        run: >-
          python3 scripts/build_public_site.py
          --output "${{ runner.temp }}/public-site"
          --report "${{ runner.temp }}/public-site-manifest.json"
      - name: Run rejection tests
        run: python3 scripts/test_public_build.py
      - name: Revalidate the artifact before upload
        run: python3 scripts/build_public_site.py --check-only --output "${{ runner.temp }}/public-site"
      - name: Upload preview only (not a Pages deployment)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # upload-artifact v7, verified via official API
        with:
          name: public-site-preview
          path: ${{ runner.temp }}/public-site/
          if-no-files-found: error
          retention-days: 7
      - name: Upload file inventory separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # upload-artifact v7, verified via official API
        with:
          name: public-site-inventory
          path: ${{ runner.temp }}/public-site-manifest.json
          if-no-files-found: error
          retention-days: 7
